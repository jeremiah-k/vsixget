[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsixget"
version = "0.2.0"
description = "A Python tool for downloading VSIX files from the Visual Studio Marketplace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jeremiah K", email = "17190268+jeremiah-k@users.noreply.github.com" },
]
maintainers = [
  { name = "Jeremiah K", email = "17190268+jeremiah-k@users.noreply.github.com" },
]
keywords = ["vscode", "extensions", "vsix", "marketplace", "download"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.5,<3",
  "packaging>=24",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=6",
  "responses>=0.25",
  "ruff>=0.17",
]
release = [
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/jeremiah-k/vsixget"
Repository = "https://github.com/jeremiah-k/vsixget"
Issues = "https://github.com/jeremiah-k/vsixget/issues"
Changelog = "https://github.com/jeremiah-k/vsixget/blob/main/CHANGELOG.md"

[project.scripts]
vsixget = "vsixget.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=vsixget --cov-report=term-missing"
markers = [
  "integration: tests that call the real Visual Studio Marketplace",
]

[tool.coverage.run]
branch = true
source = ["vsixget"]

[tool.coverage.report]
show_missing = true
fail_under = 80
