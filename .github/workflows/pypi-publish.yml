name: Publish to PyPI

"on":
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag.startswith("v"):
              tag = tag[1:]
          if tag != version:
              raise SystemExit(
                  f"release tag {tag!r} does not match pyproject version {version!r}"
              )
          print(f"Publishing vsixget {version}")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Test
        run: pytest

      - name: Build and check package
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/vsixget-smoke
          /tmp/vsixget-smoke/bin/python -m pip install --upgrade pip
          /tmp/vsixget-smoke/bin/python -m pip install dist/*.whl
          /tmp/vsixget-smoke/bin/vsixget --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          print-hash: true
          attestations: true
